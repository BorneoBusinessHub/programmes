    <script>
      (function () {
        var contentName = '劳工法令合规与HR管理文件实战课程';
        var viewContentTracked = false;
        var contactTracked = false;

        function safeTrack(eventName, params) {
          if (typeof window.fbq !== 'function') return;
          window.fbq('track', eventName, params || {});
        }

        function trackViewContentOnce() {
          if (viewContentTracked) return;
          viewContentTracked = true;
          safeTrack('ViewContent', {
            content_name: contentName,
            content_category: 'Employment Law Workshop'
          });
        }

        function trackContactOnce() {
          if (contactTracked) return;
          contactTracked = true;
          safeTrack('Contact', {
            content_name: contentName,
            content_category: 'Employment Law Workshop',
            contact_channel: 'Lead Form'
          });
        }

        function bindEvents() {
          var observerTarget = document.querySelector('[data-view-content-trigger]');
          if ('IntersectionObserver' in window && observerTarget) {
            var observer = new IntersectionObserver(function (entries) {
              entries.forEach(function (entry) {
                if (!entry.isIntersecting) return;
                trackViewContentOnce();
                observer.disconnect();
              });
            }, { threshold: 0.25 });
            observer.observe(observerTarget);
          } else {
            window.addEventListener('scroll', trackViewContentOnce, { once: true, passive: true });
            window.setTimeout(trackViewContentOnce, 1500);
          }

          document.querySelectorAll('[data-lead-form]').forEach(function (form) {
            form.addEventListener('submit', trackContactOnce);
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', bindEvents, { once: true });
        } else {
          bindEvents();
        }
      })();

      :root {

      .whatsapp-cta {

        font-weight: 900;
        line-height: 1.05;
        text-decoration: none;
        letter-spacing: 0.02em;
        background: linear-gradient(180deg, #35f277 0%, var(--whatsapp) 46%, #128c4a 100%);

        grid-column: 1 / -1;

        align-items: center;

        line-height: 1.02;
        white-space: nowrap;

      .lead-submit-sub {
        display: block;
        width: 100%;
        margin-top: clamp(3px, 0.5vw, 6px);
        font-size: clamp(22px, 3.5vw, 38px);

        box-shadow: 0 5px 0 var(--whatsapp-dark), 0 14px 24px rgba(0, 0, 0, 0.32);

      .lead-submit:disabled {

        opacity: 0.7;

      .lead-status {
        grid-column: 1 / -1;
        min-height: 24px;
        margin: 4px 0 0;
        text-align: center;
        font-weight: 800;
        font-size: 16px;

      @media (min-width: 1180px) {

      @media (max-width: 900px) {

      @media (max-width: 640px) {

        }

      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .whatsapp-cta {
          transition: none;
        }
      }

    <script>
      (function () {
        var GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsQZoNDaC80Ro8XyLy-12UGSG6E7GPwBsy421UK0Xv0ldxQjagFbbCbWcrFJV1mNemRg/exec';
        var SPREADSHEET_ID = '1C4HN6NaL4L0kiCovmc91yxkqH5JyiVRz1sK62LrYu0w';

        function currentParam(name) {
          var params = new URLSearchParams(window.location.search);
          return params.get(name) || '';
        }

        document.querySelectorAll('[data-lead-form]').forEach(function (form) {
          var pageUrlInput = form.querySelector('input[name="page_url"]');
          if (pageUrlInput) pageUrlInput.value = window.location.href;

          ['utm_source', 'utm_campaign', 'utm_content', 'utm_term', 'utm_medium'].forEach(function (key) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = currentParam(key);
            form.appendChild(input);
          });

          form.addEventListener('submit', function (event) {
            event.preventDefault();

            if (!form.checkValidity()) {
              form.reportValidity();
              return;
            }

            var status = form.querySelector('.lead-status');
            var submitButton = form.querySelector('.lead-submit');

            if (!GOOGLE_APPS_SCRIPT_URL || GOOGLE_APPS_SCRIPT_URL.indexOf('PASTE_YOUR_') === 0) {
              status.textContent = 'Google Sheet connection is not active yet. Please add the Apps Script Web App URL.';
              return;
            }

            submitButton.disabled = true;
            submitButton.textContent = '提交中...';
            status.textContent = '';

            var formData = new FormData(form);
            formData.set('spreadsheet_id', SPREADSHEET_ID);

            fetch(GOOGLE_APPS_SCRIPT_URL, {
              method: 'POST',
              body: formData,
              mode: 'no-cors'
            })
            .then(function () {
              status.textContent = '感谢提交，我们将在尽快WhatsApp联系你';
              form.reset();
              if (pageUrlInput) pageUrlInput.value = window.location.href;
            })
            .catch(function () {
              status.textContent = '提交失败，请再试一次。';
            })
            .finally(function () {
              submitButton.disabled = false;
              submitButton.innerHTML = '<span class="lead-submit-main">提交联系方式</span><span class="lead-submit-sub">了解更多详情</span>';
            });
          });
        });

        var stickyButton = document.getElementById('openLeadFormButton');
        if (stickyButton) {
          stickyButton.addEventListener('click', function () {
            var firstForm = document.querySelector('[data-lead-form]');
            if (firstForm) {
              firstForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
              var firstInput = firstForm.querySelector('input');
              if (firstInput) {
                window.setTimeout(function () { firstInput.focus(); }, 450);
              }
            }
          });
        }
      })();
    </script>
